<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#3b1426,#12080d 55%);color:#fff5f0;font-family:Arial,sans-serif}
.box{width:min(420px,90vw);padding:34px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff09;backdrop-filter:blur(15px);box-shadow:0 30px 80px #0008}
h1{font-family:Georgia,serif;font-weight:500}p{color:#cbbbc1;line-height:1.6}.field{width:100%;padding:14px 16px;margin:8px 0 14px;border-radius:12px;border:1px solid #ffffff22;background:#120b10;color:#fff;outline:none}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#ff7fa8;color:#fff;font-weight:700;cursor:pointer}.err{color:#ff9fbd;font-size:13px}
</style></head><body><main class="box">
<div style="font-size:42px">♡</div><h1>Owner Area</h1><p>Masuk untuk melihat pesan yang dikirim ke web ulang tahun.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post"><input class="field" type="password" name="password" placeholder="Password owner" required><button class="btn">Masuk</button></form>
</main></body></html>
